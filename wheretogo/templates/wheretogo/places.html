{% extends 'wheretogo/base.html' %}

{% block content %}
<div class="mt-4">
    <div class="d-flex justify-content-between align-items-center mb-4 border-bottom border-secondary pb-3">
        <h2 class="mb-0">All Places</h2>
        <div>
            <a href="{% url 'clear_places' %}" class="btn btn-outline-danger btn-sm me-2">Clear All</a>
            <a href="{% url 'add_place' %}" class="btn btn-outline-info btn-sm">Add New Place</a>
        </div>
    </div>
    <div class="row row-cols-1 row-cols-md-2 row-cols-lg-3 row-cols-xl-4 g-4">
        {% for place in places %}
            <div class="col d-flex justify-content-center">
                {% include 'wheretogo/place_preview.html' with place=place %}
            </div>
        {% empty %}
            <div class="col-12">
                <div class="w-100 text-center py-5 text-secondary border border-secondary rounded mt-3">
                    It's empty here. <a href="{% url 'add_place' %}" class="text-info text-decoration-none">Add your first place!</a>
                </div>
            </div>
        {% endfor %}
    </div>
</div>
{% endblock %}
